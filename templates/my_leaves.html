<!DOCTYPE html>
<html>
<head>
    <title>My Leave Requests</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }

        .approved {
            color: green;
            font-weight: bold;
        }

        .rejected {
            color: red;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>My Leave Requests</h1>
</div>

<div class="container">

    {% if leaves %}

    <table>

        <tr>
            <th>From Date</th>
            <th>To Date</th>
            <th>Reason</th>
            <th>Status</th>
        </tr>

        {% for leave in leaves %}

        <tr>
            <td>{{ leave["from_date"] }}</td>
            <td>{{ leave["to_date"] }}</td>
            <td>{{ leave["reason"] }}</td>

            <td class="{{ leave['status'].lower() }}">
                {{ leave["status"] }}
            </td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <p style="text-align:center;">
        You have not submitted any leave requests yet.
    </p>

    {% endif %}

    <a href="/student" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
